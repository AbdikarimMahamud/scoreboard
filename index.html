<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
      <div class="team-scores">
    <div class="score home">
        <h3 class="title">Home</h3>
        <span class="screen home"><p id="home-score">0</p></span>
        <div class="score-btns home">
            <button class="one-home-btn">+1</button>
            <button class="three-home-btn">+3</button>
            <button class="five-home-btn">+5</button>
        </div>
    </div>
    <div class="score away">
        <h3 class="title">Away</h3>
        <span class="screen away"><p id="away-score">0</p></span>
        <div class="score-btns away">
            <button class="one-away-btn">+1</button>
            <button class="three-away-btn ">+3</button>
            <button class="five-away-btn">+5</button>
        </div>
    </div>
  </div>
    <button class="reset-btn">Reset</button>
    
    
<script src="app.js"></script>
</body>
</html>
